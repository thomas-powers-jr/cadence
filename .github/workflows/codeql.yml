name: CodeQL

# Static analysis via GitHub's CodeQL, scoped to the single javascript-typescript
# language this monorepo is written in. Runs on push/PR so new code is scanned
# before it lands, and on a weekly schedule (independent of push/PR activity)
# so analysis coverage doesn't silently lapse if the repo goes quiet — rec-20260712-013.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC

permissions:
  actions: read # required so the analyze step can read workflow run metadata
  contents: read # checkout the repo
  security-events: write # upload CodeQL results to the Security tab

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}

      # No compiled build step is needed for javascript-typescript — CodeQL's
      # extractor parses source directly, so the autobuild/manual-build steps
      # used for compiled languages are intentionally omitted here.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: '/language:${{ matrix.language }}'

  # Single stable status context for branch protection, mirroring ci.yml's
  # ci-success pattern. codeql-success is one of main's three required status
  # checks -- required_status_checks.contexts is ci-success,
  # security-success and codeql-success (registered 2026-08-07,
  # rec-20260807-002; the record is docs/security/audit-exceptions.md) -- so
  # a red codeql-success blocks every merge to main. analyze runs under
  # a language matrix, so its own GitHub status check reports under a
  # matrix-derived name (e.g. "analyze (javascript-typescript)") -- this job
  # exists so the required-check name stays `codeql-success` independent of
  # the matrix shape.
  #
  # Scope, stated explicitly (rec-20260804-006, AC-3): codeql-success gates
  # on the analyze job *completing* -- i.e. the CodeQL scan ran to
  # completion -- not on the scan finding zero issues. CodeQL's own analyze
  # step does not fail its job by default when it finds alerts; findings
  # surface in the GitHub Security tab, not as a failed job. So even though
  # codeql-success is a required check, a PR can still merge with
  # codeql-success green while CodeQL has open findings. Contrast
  # security-success in security.yml: its secret-scan and audit dependencies
  # genuinely fail their jobs on real conditions (a detected leaked
  # credential, an undocumented high/critical advisory, or a
  # pnpm.overrides target that no longer covers every resolved instance of
  # that package in pnpm-lock.yaml), so security-success failing means
  # something concrete failed. codeql-success passing means only "the scan
  # ran" -- never "no CodeQL findings". Do not let any doc, comment, or
  # SUMMARY claim otherwise.
  codeql-success:
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the analyze job did not succeed
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "analyze job result: ${{ needs.analyze.result }}"
            exit 1
          fi
          echo "analyze job succeeded"
